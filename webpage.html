<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
       body {
  background: #f5f5f5;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial, sans-serif;
}
.card {
  position: relative;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, #ff1a1a, #cc0000);
  color: white;
  text-align: center;
  border-radius: 10px;
  padding: 20px;
  overflow: hidden; 
}
.badge {
  background: #eee;
  color: #cc0000;
  display: inline-block;
  padding: 5px 15px;
  border-radius: 8px;
  font-weight: bold;
  margin-bottom: 15px;
}
h1 {
  font-size: 32px;
  margin: 20px 0;
  line-height: 1.2;
  font-weight: bold;
}

.price {
  font-size: 14px;
  opacity: 0.9;
}

.domain {
  font-weight: bold;
  margin-top: 5px;
}
    </style>
</head>
<body>
    <div class="card">
  <div class="badge">PROFESSIONAL</div>
  <h1>
    5 PAGE <br />
    WEBSITE
  </h1>

  <p class="price">Original Price: $949.00</p>
  <p class="domain">DOMAIN INCLUDED!</p>
</div>
</body>
</html>
